name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test:coverage + tested + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          # standalone install — bypasses the runner's default Node
          # (which is too old for pnpm 11.3.0's engines.node >=22.13)
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:coverage

      # Coverage gate + ingest (JUnit flakes / suite time) on every PR.
      # Run after a failed suite so junit.xml still uploads. push is
      # continue-on-error inside the Action; check remains the gate.
      - uses: tested-hq/cli/action@main
        if: success() || failure()
        with:
          version: 0.1.7
          push: true
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.TESTED_TOKEN }}
          junit: junit.xml

      - run: pnpm build
